name: CI
on: [push, pull_request]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Bloquear archivos con datos personales o secretos
        run: |
          bad=$(git ls-files | grep -Ei '(^datos-reales/|vercel-recovery-codes.*\.txt$|\.(pdf|xlsx|xls|docx|zip|csv|pem|key|p12|pfx|jks|keystore|kdbx|dump|sql\.gz|bak|log)$|(^|/)\.env($|\.))' | grep -vE '(^|/)\.env\.example$' || true)
          if [ -n "$bad" ]; then echo "Archivos prohibidos en el repositorio:"; echo "$bad"; exit 1; fi
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run build
